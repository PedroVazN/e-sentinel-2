<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-Sentinel API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b 45%, #0f172a);
      color: #e2e8f0;
      padding: 24px;
    }
    .card {
      width: min(520px, 100%);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 28px;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    h1 { font-size: 1.6rem; margin-bottom: 8px; }
    p { color: #94a3b8; line-height: 1.5; margin-bottom: 18px; }
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(15,23,42,0.55);
      margin-bottom: 16px;
      font-weight: 600;
    }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: #64748b;
      box-shadow: 0 0 0 0 rgba(100,116,139,0.5);
      animation: pulse 1.4s infinite;
    }
    .ok { background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
    .err { background: #ef4444; box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.25); }
      70% { box-shadow: 0 0 0 10px rgba(255,255,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }
    code, a {
      color: #38bdf8;
      word-break: break-all;
    }
    .links { display: grid; gap: 8px; font-size: 0.92rem; }
    button {
      margin-top: 14px;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      font-weight: 700;
      cursor: pointer;
      color: #0f172a;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>e-Sentinel 2 — API Backend</h1>
    <p>Servidor backend online. Esta página confirma que o deploy da pasta <code>server/</code> está ativo.</p>

    <div class="status" id="statusBox">
      <span class="dot" id="dot"></span>
      <span id="statusText">Verificando /api/health...</span>
    </div>

    <div class="links">
      <div>Health: <a href="/api/health" target="_blank" rel="noreferrer">/api/health</a></div>
      <div>Dashboard: <a href="/api/dashboard" target="_blank" rel="noreferrer">/api/dashboard</a></div>
    </div>

    <button type="button" onclick="checkHealth()">Testar novamente</button>
  </main>

  <script>
    async function checkHealth() {
      const dot = document.getElementById('dot');
      const text = document.getElementById('statusText');
      dot.className = 'dot';
      text.textContent = 'Verificando API...';

      try {
        const controller = new AbortController();
        const t = setTimeout(() => controller.abort(), 8000);
        const res = await fetch('/api/health', { cache: 'no-store', signal: controller.signal });
        clearTimeout(t);
        const data = await res.json();
        if (res.ok && data.status === 'ok') {
          dot.classList.add('ok');
          text.textContent = 'API online — teste dados em /api/dashboard';
        } else {
          dot.classList.add('err');
          text.textContent = 'Erro API: ' + (data.error || res.status);
        }
      } catch {
        dot.classList.add('err');
        text.textContent = 'Timeout 8s — Vercel Hobby limita 10s. Use Railway/Render para API ou cluster Mongo em São Paulo.';
      }
    }

    checkHealth();
  </script>
</body>
</html>
