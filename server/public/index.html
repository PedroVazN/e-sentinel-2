<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-Sentinel API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b 45%, #0f172a);
      color: #e2e8f0;
      padding: 24px;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 6px; }
    .sub { color: #94a3b8; margin-bottom: 20px; font-size: 0.95rem; }
    .status {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(15,23,42,0.55); margin-bottom: 16px; font-weight: 600;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #64748b; }
    .dot.ok { background: #22c55e; }
    .dot.err { background: #ef4444; }
    .grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px;
    }
    .kpi {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; padding: 16px;
    }
    .kpi label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
    .kpi strong { display: block; font-size: 1.75rem; margin-top: 4px; color: #fff; }
    button {
      margin-top: 16px; width: 100%; border: 0; border-radius: 10px; padding: 12px;
      font-weight: 700; cursor: pointer; color: #0f172a;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
    }
    .err-box {
      margin-top: 12px; padding: 12px; border-radius: 10px;
      background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3);
      font-size: 0.85rem; color: #fecaca; display: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>e-Sentinel 2 — API</h1>
    <p class="sub">Dados reais do MongoDB via <code>/api/dashboard</code></p>

    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">Carregando dados...</span>
    </div>

    <div class="grid" id="kpis" style="display:none">
      <div class="kpi"><label>Produtos</label><strong id="kProducts">—</strong></div>
      <div class="kpi"><label>Categorias</label><strong id="kCategories">—</strong></div>
      <div class="kpi"><label>Estoque (un)</label><strong id="kStock">—</strong></div>
      <div class="kpi"><label>Valor estoque</label><strong id="kValue">—</strong></div>
    </div>

    <div class="err-box" id="errBox"></div>
    <button type="button" onclick="loadData()">Atualizar dados</button>
  </div>

  <script>
    function fmtMoney(n) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(n || 0);
    }

    async function loadData() {
      const dot = document.getElementById('dot');
      const text = document.getElementById('statusText');
      const kpis = document.getElementById('kpis');
      const errBox = document.getElementById('errBox');

      dot.className = 'dot';
      text.textContent = 'Conectando ao MongoDB e buscando dados...';
      kpis.style.display = 'none';
      errBox.style.display = 'none';

      try {
        const controller = new AbortController();
        const t = setTimeout(() => controller.abort(), 55000);
        const res = await fetch('/api/dashboard', { cache: 'no-store', signal: controller.signal });
        clearTimeout(t);
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || data.error || 'HTTP ' + res.status);
        }

        if (!data.totals) {
          throw new Error('Resposta sem dados (totals ausente)');
        }

        document.getElementById('kProducts').textContent = data.totals.products ?? 0;
        document.getElementById('kCategories').textContent = data.totals.categories ?? 0;
        document.getElementById('kStock').textContent = data.totals.stockUnits ?? 0;
        document.getElementById('kValue').textContent = fmtMoney(data.totals.stockValue);

        kpis.style.display = 'grid';
        dot.classList.add('ok');
        text.textContent = 'Dados reais carregados do MongoDB';
      } catch (e) {
        dot.classList.add('err');
        text.textContent = 'Falha ao carregar dados reais';
        errBox.style.display = 'block';
        errBox.innerHTML =
          '<strong>Erro:</strong> ' + (e.message || e) +
          '<br><br>Na Vercel (plano grátis) o MongoDB costuma dar timeout. ' +
          'Hospede a API no <strong>Railway</strong> (pasta server/) para dados reais estáveis.';
      }
    }

    loadData();
  </script>
</body>
</html>
